version: 0.2

env:
  git-credential-helper: yes
  variables:
    DOCKER_BUILDKIT: 1
    ARTIFACT_DIR: "/tmp/artifact"

phases:
  install:
    commands:
      - IMAGE_TAG=$(git rev-parse HEAD)
      - REPOSITORY_URI=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY_NAME}
      - echo "Installing jq"
      - yum install -y jq
      - echo $IMAGE_TAG

  pre_build:
    commands:
      - echo Logging in Docker Hub
      - echo $DOCKERHUB_USERNAME
      - echo $DOCKERHUB_PASSWORD
      - docker login --username ${DOCKERHUB_USERNAME} --password ${DOCKERHUB_PASSWORD}
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com
      - echo Checking Docker version
      - docker --version

  build:
    commands:
      - echo Build started on `date`
      - echo Building the Docker image...
      - echo $REPOSITORY_URI:$IMAGE_TAG
      - docker build -f Dockerfile -t $REPOSITORY_URI:$IMAGE_TAG .
      - docker tag $REPOSITORY_URI:$IMAGE_TAG $REPOSITORY_URI:latest

  post_build:
    commands:
      - echo Build completed on `date`
      - echo Pushing the Docker image...
      - docker push $REPOSITORY_URI:$IMAGE_TAG
      - docker push $REPOSITORY_URI:latest
      - echo Writing image definitions file...
      - printf '[{"name":"console","imageUri":"%s"}]' "$REPOSITORY_URI:$IMAGE_TAG" > imagedefinitions.json

cache:
  paths:
    - 'node_modules/**/*' # Cache `node_modules` for faster `yarn` or `npm i`
    - '.next/cache/**/*' # Cache Next.js for faster application rebuilds

artifacts:
  files: imagedefinitions.json
